[project]
name = "abupt"
version = "0.1.0"
description = "Anchored-Branched Universal Physics Transformer for cylinder flow on unstructured meshes"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.6.6",
    "meshio>=5.3.5",
    "numpy>=2.0",
    "torch==2.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abupt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
